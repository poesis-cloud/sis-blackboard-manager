server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sis-blackboard-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sis_blackboard}
    username: ${DB_USER:sis}
    password: ${DB_PASSWORD:change-me}
  hateoas:
    use-hal-as-default-json-media-type: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000/realms/sie}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  enable-hateoas: true

bbm:
  security:
    oauth2-login-enabled: ${BBM_OAUTH2_LOGIN_ENABLED:false}
